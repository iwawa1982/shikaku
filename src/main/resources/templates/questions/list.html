
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>問題一覧</title>
</head>

<body>

    <h1>資格試験 問題一覧</h1>

    <hr>

    <!-- 画面移動用リンク -->
    <nav>
        <a th:href="@{/questions}">問題一覧</a>
        ｜
        <a th:href="@{/questions/new}">問題を新規登録</a>
    </nav>

    <hr>

    <h2>登録済みの問題</h2>

    <!-- 問題がない場合 -->
    <p th:if="${#lists.isEmpty(questions)}">
        現在、問題は登録されていません。
    </p>

    <!-- 問題がある場合 -->
    <table th:unless="${#lists.isEmpty(questions)}"
           border="1" cellpadding="8">

        <thead>
            <tr>
                <th>年度</th>
                <th>問題番号</th>
                <th>問題文</th>
                <th>直近3回の解答履歴</th>
            </tr>
        </thead>

        <tbody>

            <!-- 問題を1件ずつ表示 -->
            <tr th:each="question : ${questions}">

                <!-- 年度 -->
                <td th:text="${question.year}"></td>

                <!-- 問題番号 -->
                <td th:text="${question.questionNo}"></td>

                <!-- 問題詳細へのリンク -->
                <td>
                    <a th:href="@{/questions/{id}(id=${question.id})}"
                       th:text="${question.questionText}">
                    </a>
                </td>

                <!-- 直近3回の解答履歴 -->
                <td>

                    <!-- 履歴がない場合 -->
                    <span th:if="${#lists.isEmpty(historyMap[question.id])}">
                        未解答
                    </span>

                    <!-- 履歴がある場合 -->
                    <span th:each="history : ${historyMap[question.id]}">

                        <!-- 正解 -->
                        <strong th:if="${history.isCorrect}"
                                style="color: blue;">
                            ○
                        </strong>

                        <!-- 不正解 -->
                        <strong th:unless="${history.isCorrect}"
                                style="color: red;">
                            ×
                        </strong>

                    </span>

                </td>

            </tr>

        </tbody>

    </table>

    <hr>

    <!-- 新規登録へのリンク -->
    <p>
        <a th:href="@{/questions/new}">
            ＋ 新しい問題を登録する
        </a>
    </p>

</body>
</html>
